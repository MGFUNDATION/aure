name: Probar APK en Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en un emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.aure.app -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell pidof com.aure.app && echo "AURE_RUNNING=yes" || echo "AURE_RUNNING=no"
            adb exec-out screencap -p > captura.png
            adb logcat -d > logcat.txt
            echo "===== ERRORES ====="; grep -E "FATAL|AndroidRuntime|E flutter|E/flutter|Exception|Error" logcat.txt | grep -v "^--" | head -150 || true
            echo "===== FIN ====="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-emulador
          path: |
            captura.png
            logcat.txt
